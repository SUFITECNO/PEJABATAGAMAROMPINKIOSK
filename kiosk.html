<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kiosk Perkhidmatan</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<script>
firebase.initializeApp(window.FIREBASE_CONFIG);
const db = firebase.database();

function printReceipt(number, type) {
  const now = new Date();

  /* Date format: 10/6/2026 @13:26 */
  const dateTime =
    now.getDate() + "/" +
    (now.getMonth() + 1) + "/" +
    now.getFullYear() + " @" +
    now.getHours().toString().padStart(2, '0') + ":" +
    now.getMinutes().toString().padStart(2, '0');

  /* Service name map */
  const serviceNames = {
    K: "Pendaftaran Perkahwinan",
    F: "Pembangunan Keluarga",
    M: "Masjid & Surau",
    D: "Dakwah",
    L: "Lain-lain"
  };
  const serviceName = serviceNames[type] || "";

  /* ── SILENT IFRAME PRINT ──────────────────────────────────────────
     Injects a hidden iframe directly into this page and prints it.
     Chrome will NOT show a popup-blocker warning because no new window
     is opened — the iframe lives inside the same document origin.
     After printing, the iframe is removed automatically.
  ──────────────────────────────────────────────────────────────── */
  const receiptHTML = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nombor Giliran</title>
  <style>
    @page {
      size: 58mm auto;
      margin: 0;
    }
    * { box-sizing: border-box; }
    body {
      width: 48mm;
      margin: 0 auto;
      padding: 4mm 0 6mm;
      font-family: Arial, sans-serif;
      font-size: 11px;
      text-align: center;
      color: #000;
      background: #fff;
    }
    .org-name {
      font-size: 12px;
      font-weight: bold;
      line-height: 1.4;
      margin-bottom: 2px;
    }
    .org-jawi {
      font-size: 13px;
      font-weight: bold;
      direction: rtl;
      font-family: Arial, sans-serif;
      line-height: 1.5;
      margin-bottom: 1px;
    }
    hr {
      border: none;
      border-top: 1px dashed #000;
      margin: 5px 0;
    }
    .label {
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #333;
      margin-bottom: 2px;
    }
    .queue-number {
      font-size: 42px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.04em;
      margin: 6px 0 4px;
    }
    .service-name {
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .message {
      font-size: 10px;
      line-height: 1.5;
      margin: 4px 0;
    }
    .datetime-label {
      font-size: 10px;
      color: #444;
      margin-bottom: 1px;
    }
    .datetime-value {
      font-size: 11px;
      font-weight: bold;
    }
    .thanks {
      font-size: 10px;
      margin-top: 4px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="org-name">Pejabat Agama Islam<br>Daerah Rompin</div>
  <div class="org-jawi">&#1700;&#1580;&#1575;&#1576;&#1578; &#1575;&#1620;&#1575;&#1605;&#1577; &#1575;&#1587;&#1604;&#1575;&#1605; &#1583;&#1575;&#1574;&#1585;&#1607; &#1585;&#1608;&#1605;&#1576;&#1610;&#1606;</div>
  <hr>
  <div class="label">NOMBOR GILIRAN</div>
  <div class="queue-number">${number}</div>
  <div class="service-name">${serviceName}</div>
  <hr>
  <div class="message">Sila duduk.<br>Anda akan dilayan sebentar lagi.</div>
  <hr>
  <div class="datetime-label">Tarikh &amp; Masa</div>
  <div class="datetime-value">${dateTime}</div>
  <hr>
  <div class="thanks">Terima kasih</div>
</body>
</html>`;

  /* Create a hidden iframe, write the receipt into it, then print */
  const iframe = document.createElement('iframe');
  iframe.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:0;height:0;border:none;visibility:hidden;';
  document.body.appendChild(iframe);

  const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
  iframeDoc.open();
  iframeDoc.write(receiptHTML);
  iframeDoc.close();

  /* Wait for iframe content to fully load before printing */
  iframe.onload = function () {
    try {
      iframe.contentWindow.focus();
      iframe.contentWindow.print();
    } catch (e) {
      console.error('Print error:', e);
    }
    /* Remove the iframe after a short delay to allow print to spool */
    setTimeout(function () {
      document.body.removeChild(iframe);
    }, 2000);
  };
}

function createQueue(type) {
  let num = type + Math.floor(Math.random() * 900 + 100);

  db.ref("queues/" + num).set({
    number: num,
    status: "waiting",
    stage: "service",
    service: type,
    counter: null,
    timestamp: Date.now()
  });

  document.getElementById("latest").innerText = num;

  // 🖨️ AUTO PRINT CALL
  printReceipt(num, type);
}
</script>

</head>

<body class="kiosk-page">

<header>
  <div class="brand">
    <img src="image/images.png" alt="Logo Pejabat Agama Islam Daerah Rompin">
    <div class="brand-text">
      <h1>Pejabat Agama Islam Daerah Rompin</h1>
      <p class="brand-jawi">&#1700;&#1580;&#1575;&#1576;&#1578; &#1575;&#1890;&#1575;&#1605; &#1575;&#1587;&#1604;&#1575;&#1605; &#1583;&#1575;&#1569;&#1610;&#1585;&#1607; &#1585;&#1608;&#1605;&#1700;&#1610;&#1606;</p>
    </div>
  </div>
</header>

<div class="wrapper">

  <div class="left">
    <h2>Pilih Perkhidmatan</h2>

    <div class="grid">
      <button class="card-btn" onclick="createQueue('K')">
        <span class="service-icon">01</span>
        <span class="service-copy">
          <span class="service-name">Pendaftaran Perkahwinan</span>
          <span class="service-jawi" lang="ar" dir="rtl">&#1700;&#1606;&#1583;&#1601;&#1578;&#1585;&#1606; &#1700;&#1585;&#1705;&#1607;&#1608;&#1610;&#1606;&#1606;</span>
        </span>
      </button>

      <button class="card-btn" onclick="createQueue('F')">
        <span class="service-icon">02</span>
        <span class="service-copy">
          <span class="service-name">Pembangunan Keluarga</span>
          <span class="service-jawi" lang="ar" dir="rtl">&#1700;&#1605;&#1576;&#1575;&#1696;&#1608;&#1606;&#1606; &#1705;&#1604;&#1608;&#1575;&#1585;&#1890;</span>
        </span>
      </button>

      <button class="card-btn" onclick="createQueue('M')">
        <span class="service-icon">03</span>
        <span class="service-copy">
          <span class="service-name">Masjid & Surau</span>
          <span class="service-jawi" lang="ar" dir="rtl">&#1605;&#1587;&#1580;&#1583; &#1583;&#1575;&#1606; &#1587;&#1608;&#1585;&#1575;&#1608;</span>
        </span>
      </button>

      <button class="card-btn" onclick="createQueue('D')">
        <span class="service-icon">04</span>
        <span class="service-copy">
          <span class="service-name">Dakwah</span>
          <span class="service-jawi" lang="ar" dir="rtl">&#1583;&#1593;&#1608;&#1607;</span>
        </span>
      </button>

      <button class="card-btn" onclick="createQueue('L')">
        <span class="service-icon">05</span>
        <span class="service-copy">
          <span class="service-name">Lain-lain</span>
          <span class="service-jawi" lang="ar" dir="rtl">&#1604;&#1575;&#1569;&#1610;&#1606;-&#1604;&#1575;&#1569;&#1610;&#1606;</span>
        </span>
      </button>
    </div>
  </div>

  <div class="right">

    <div class="queue-box">
      <h2>Nombor Giliran Terkini</h2>
      <div class="queue-number" id="latest">---</div>
    </div>

    <div class="info">
      <h3>Maklumat</h3>
      <p>
        Sila pilih perkhidmatan yang dikehendaki.<br>
        Ambil nombor giliran dan tunggu panggilan di skrin utama.
      </p>
    </div>

  </div>

</div>

<footer>
  &copy; 2026 Pejabat Agama Islam Daerah Rompin. Hak Cipta Terpelihara.
</footer>

</body>
</html>
