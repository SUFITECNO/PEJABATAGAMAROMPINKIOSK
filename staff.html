<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Queue Panel</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
  .staff-page .actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }

  .staff-page .actions button {
    border: none;
    padding: 9px 14px;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
    min-width: 90px;
    text-align: center;
    transition: opacity .15s, transform .12s;
  }

  .staff-page .actions button:active   { transform: scale(.95); }
  .staff-page .actions button:disabled { opacity: .45; cursor: not-allowed; transform: none; }

  .staff-page .done { background: var(--danger); }
  .staff-page .pay  { background: var(--gold-600); }
  .staff-page .call {
    background: var(--green-700);
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }

  .icon-speaker { width: 16px; height: 16px; fill: white; flex-shrink: 0; }

  /* Local card highlight when Panggil is pressed */
  .queue-card.calling {
    border-left-color: var(--gold-600) !important;
    background: #fffbe6;
  }

  .queue-summary {
    display: flex; gap: 14px; margin-bottom: 14px; flex-wrap: wrap;
  }
  .summary-chip {
    background: white;
    border: 1px solid rgba(17,116,71,.15);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 13px; font-weight: 600;
    color: var(--green-900);
    box-shadow: 0 2px 8px rgba(7,63,42,.07);
  }
  .summary-chip span { color: var(--gold-600); }

  .grid-header {
    display: grid;
    grid-template-columns: 130px 1fr 120px 120px 300px;
    gap: 10px;
    padding: 8px 14px;
    font-size: 11px; font-weight: 700;
    color: var(--muted);
    text-transform: uppercase; letter-spacing: .06em;
    border-bottom: 2px solid rgba(17,116,71,.08);
    margin-bottom: 4px;
  }

  @media (max-width: 900px) { .grid-header { display: none; } }
</style>
</head>

<body class="staff-page">

<header>
  <div class="brand">
    <img src="image/images.png" alt="Logo Pejabat Agama Islam Daerah Rompin">
    <div class="brand-text">
      <h3>Pejabat Agama Islam Daerah Rompin</h3>
      <p class="brand-jawi">&#1700;&#1580;&#1575;&#1576;&#1578; &#1575;&#1890;&#1575;&#1605; &#1575;&#1587;&#1604;&#1575;&#1605; &#1583;&#1575;&#1569;&#1610;&#1585;&#1607; &#1585;&#1608;&#1605;&#1700;&#1610;&#1606;</p>
    </div>
  </div>
</header>

<div class="container">
  <div class="queue-summary" id="summary"></div>

  <div class="grid-header">
    <div>No. Giliran</div>
    <div>Status</div>
    <div>Stage</div>
    <div>Masa</div>
    <div>Tindakan</div>
  </div>

  <div class="queue-grid" id="queueTable"></div>
</div>

<footer>
  &copy; 2026 Pejabat Agama Islam Daerah Rompin
</footer>

<script>
/* ═══════════════════════════════════════════
   FIREBASE
═══════════════════════════════════════════ */
firebase.initializeApp(window.FIREBASE_CONFIG);
const db = firebase.database();

/* NOTE: Voice/speech is handled ONLY by tv.html.
   Staff panel writes called:true to Firebase to trigger TV to speak.
   Staff panel does NOT speak itself. */

let isProcessing = false;
let prevState = {};   // key → { status, stage, autoCalled }

/* ═══════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════ */
function getServiceName(code) {
  return {
    K: "Pendaftaran Perkahwinan",
    F: "Pembangunan Keluarga",
    M: "Masjid & Surau",
    D: "Dakwah",
    L: "Lain-lain"
  }[code] || "-";
}

function getStatusName(status) {
  return { waiting: "Menunggu", serving: "Sedang Dilayan" }[status] || "-";
}

function displayValue(value, fallback = "-") {
  return value === undefined || value === null || value === "" ? fallback : value;
}

function isValidServiceQueue(d) {
  return !!d &&
    d.stage === "service" &&
    ["waiting", "serving"].includes(d.status) &&
    ["K", "F", "M", "D", "L"].includes(d.service) &&
    typeof d.number === "string" &&
    /^[KFMDL]\d{3}$/.test(d.number);
}

const speakerIcon = `<svg class="icon-speaker" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
</svg>`;

/* ═══════════════════════════════════════════
   RENDER
═══════════════════════════════════════════ */
function renderQueue(snap) {
  const container = document.getElementById("queueTable");
  const summary   = document.getElementById("summary");
  container.innerHTML = "";

  let allQueues = [];
  snap.forEach(child => {
    let d = child.val();
    if (!isValidServiceQueue(d)) return;
    allQueues.push({ key: child.key, ...d });
  });

  allQueues.sort((a, b) => a.timestamp - b.timestamp);

  let waiting = allQueues.filter(q => q.status === "waiting").length;
  let serving  = allQueues.filter(q => q.status === "serving").length;

  summary.innerHTML = `
    <div class="summary-chip">Menunggu: <span>${waiting}</span></div>
    <div class="summary-chip">Dilayan: <span>${serving}</span></div>
    <div class="summary-chip">Jumlah: <span>${allQueues.length}</span></div>
  `;

  const displayQueues = [
    ...allQueues.filter(q => q.status === "serving"),
    ...allQueues.filter(q => q.status === "waiting")
  ];

  displayQueues.forEach(d => {
    const key         = d.key;
    const statusClass = d.status === "serving" ? "serving" : "waiting";
    const queueNumber = displayValue(d.number);
    const counterId   = displayValue(d.counter, null);

    /* ── AUTO-CALL LOGIC ──
       When a queue first enters serving status and hasn't been auto-called,
       set called:true in Firebase. The TV (tv.html) will detect called:true
       and speak the announcement, then reset called:false when done.
    */
    const prev = prevState[key];
    const justBecameServing =
      d.status === "serving" &&
      !d.autoCalled &&
      (!prev || prev.status !== "serving");

    if (justBecameServing) {
      // Mark autoCalled so no other client/reload triggers again
      // Set called:true — TV will detect and announce
      db.ref("queues/" + key).update({ autoCalled: true, called: true });
    }

    // Update local state tracking
    prevState[key] = { status: d.status, stage: d.stage, autoCalled: !!d.autoCalled };

    container.innerHTML += `
      <div class="queue-card" id="card-${key}">

        <div class="queue-no">
          ${queueNumber}
          <div class="small">${getServiceName(d.service)}</div>
        </div>

        <div>
          <span class="badge ${statusClass}">
            ${getStatusName(d.status)}
          </span>
          <div class="small">Kaunter: ${counterId || "-"}</div>
        </div>

        <div class="small">${d.stage || "-"}</div>

        <div class="small">
          ${d.timestamp ? new Date(d.timestamp).toLocaleTimeString("ms-MY") : "-"}
        </div>

        <div class="actions">
          <button class="done" onclick="doneQueue('${key}', '${counterId || 'null'}')" ${d.status === "serving" && counterId ? "" : "disabled"}>SELESAI</button>
          <button class="pay"  onclick="sendToPayment('${key}')" ${d.status === "serving" && counterId ? "" : "disabled"}>BAYARAN</button>
          <button class="call" onclick="manualCall('${key}')" ${d.status === "serving" && counterId ? "" : "disabled"}>
            ${speakerIcon} PANGGIL
          </button>
        </div>

      </div>
    `;
  });

  // Clean up prevState for removed keys
  Object.keys(prevState).forEach(k => {
    if (!allQueues.find(q => q.key === k)) delete prevState[k];
  });

  if (allQueues.length === 0) {
    container.innerHTML = `<div style="text-align:center;color:var(--muted);padding:40px;font-size:15px;">Tiada giliran dalam senarai</div>`;
  }
}

/* ═══════════════════════════════════════════
   MANUAL CALL — sets called:true in Firebase
   TV will detect and announce, then reset to false
═══════════════════════════════════════════ */
function manualCall(key) {
  // Brief highlight on the card so staff knows it was triggered
  const card = document.getElementById("card-" + key);
  if (card) {
    card.classList.add("calling");
    setTimeout(() => card.classList.remove("calling"), 3000);
  }
  // Tell TV to announce by setting called:true
  db.ref("queues/" + key).update({ called: true });
}

/* ═══════════════════════════════════════════
   AUTO ASSIGN (FIFO, no skip)
═══════════════════════════════════════════ */
function autoAssignQueue() {
  if (isProcessing) return;
  isProcessing = true;

  db.ref("counters").once("value", counterSnap => {
    db.ref("queues").once("value", queueSnap => {
      let paymentQueues = [];
      let hasServingPayment = false;
      let busyCounters = new Set();
      let queues = [];

      queueSnap.forEach(child => {
        const d = child.val();
        if (d && d.status === "serving" && d.stage === "payment") {
          hasServingPayment = true;
          busyCounters.add(4);
        }
        if (isValidServiceQueue(d) && d.status === "serving" && d.counter) {
          busyCounters.add(Number(d.counter));
        }
        if (d && d.status === "waiting" && d.stage === "payment") {
          paymentQueues.push({ key: child.key, ...d });
        }
        if (isValidServiceQueue(d) && d.status === "waiting") {
          queues.push({ key: child.key, ...d });
        }
      });

      paymentQueues.sort((a, b) => a.timestamp - b.timestamp);
      queues.sort((a, b) => a.timestamp - b.timestamp);

      if (!hasServingPayment && paymentQueues.length > 0) {
        const q = paymentQueues[0];
        db.ref("counters/4").set({ status:"busy", current:q.key, lastFree:Date.now() });
        db.ref("queues/" + q.key).update({
          status:"serving", counter:4, called:false, autoCalled:false
        });
        isProcessing = false;
        return;
      }

      for (const q of queues) {
        let assigned = null;
        const c1 = !busyCounters.has(1);
        const c2 = !busyCounters.has(2);
        const c3 = !busyCounters.has(3);

        if (q.service === "K" && c1)      assigned = 1;
        else if (q.service === "F") {
          if (c1)      assigned = 1;
          else if (c2) assigned = 2;
        }
        else if (q.service === "M" && c3) assigned = 3;
        else if (q.service === "D" && c2) assigned = 2;
        else if (q.service === "L" && c3) assigned = 3;

        if (assigned) {
          db.ref("counters/" + assigned).set({ status:"busy", current:q.key, lastFree:Date.now() });
          db.ref("queues/" + q.key).update({
            status:"serving", counter:assigned, called:false, autoCalled:false
          });
          break;
        }
      }
      isProcessing = false;
    });
  });
}

/* ═══════════════════════════════════════════
   DONE
═══════════════════════════════════════════ */
function doneQueue(key, counterId) {
  db.ref("queues/" + key).remove();
  if (counterId && counterId !== "null") {
    db.ref("counters/" + counterId).update({ status:"free", current:null, lastFree:Date.now() });
  }
}

/* ═══════════════════════════════════════════
   BAYARAN → Kaunter 4
═══════════════════════════════════════════ */
function sendToPayment(key) {
  isProcessing = true;

  db.ref("queues/" + key).once("value", snap => {
    const d = snap.val();
    if (!d || d.stage !== "service") {
      alert("Hanya pelanggan dalam servis boleh ke pembayaran.");
      isProcessing = false;
      return;
    }

    const oldCounter = d.counter;
    delete prevState[key];

    db.ref("queues/" + key).update({
      stage:"payment", status:"waiting", counter:null, called:false, autoCalled:false
    }).then(() => {
      if (oldCounter && oldCounter != 4) {
        return db.ref("counters/" + oldCounter).update({ status:"free", current:null, lastFree:Date.now() });
      }
    }).then(() => {
      isProcessing = false;
      autoAssignQueue();
    }).catch(() => { isProcessing = false; });
  });
}

/* ═══════════════════════════════════════════
   INIT COUNTERS
═══════════════════════════════════════════ */
function initCounters() {
  db.ref("counters").once("value", snap => {
    if (!snap.exists()) {
      db.ref("counters").set({
        1: { status:"free", current:null, lastFree:Date.now() },
        2: { status:"free", current:null, lastFree:Date.now() },
        3: { status:"free", current:null, lastFree:Date.now() },
        4: { status:"free", current:null, lastFree:Date.now() }
      });
    }
  });
}

/* ═══════════════════════════════════════════
   LISTENERS
═══════════════════════════════════════════ */
db.ref("queues").on("value", snap => {
  renderQueue(snap);
  autoAssignQueue();
});

db.ref("counters").on("value", () => autoAssignQueue());

initCounters();
</script>

</body>
</html>
