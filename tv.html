<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Queue Display System</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
  .tv-page .card.glow {
    animation: strongBlink 0.8s ease-in-out infinite;
    border: 3px solid var(--gold-300);
    box-shadow: 0 0 40px rgba(201,162,39,1), 0 0 80px rgba(201,162,39,.45);
    transform: scale(1.04);
    z-index: 10;
    position: relative;
  }
  @keyframes strongBlink {
    0%   { background: #ffffff; box-shadow: 0 0 12px rgba(201,162,39,.4); }
    50%  { background: #fff2b7; box-shadow: 0 0 55px rgba(201,162,39,1);  }
    100% { background: #ffffff; box-shadow: 0 0 12px rgba(201,162,39,.4); }
  }
  .tv-page .card.flash { animation: flash 1s ease-in-out 2; }
  .tv-page .service-label {
    margin-top: 0.5vh;
    color: var(--muted);
    font-size: 1.8vh;
    font-weight: 500;
  }
  .tv-page .container { padding-top: 0.5rem !important; }
  
  /* ─── FIX: Pembayaran box same width as Kaunter 1–3 ─── */
  .tv-page .left,
  .tv-page .right {
    flex: 1;
    min-width: 0;
  }
  /* Force both card types to have identical sizing */
  .tv-page .left .card,
  .tv-page .right .card {
    width: 100%;
    box-sizing: border-box;
    margin: 0 auto;
  }
  /* Remove any extra padding that might affect the right column */
  .tv-page .right .payment-card {
    width: 100%;
  }
  .tv-page .container {
    display: flex;
    gap: 2rem;
    align-items: stretch;
  }
  /* ──────────────────────────────────────────── */

  .tv-page .section-title { margin-top: 0; padding-top: 0; }
</style>
</head>

<body class="tv-page">

<header>
  <div class="brand">
    <img src="image/images.png" alt="Logo Pejabat Agama Islam Daerah Rompin">
    <div class="brand-text">
      <strong>Pejabat Agama Islam Daerah Rompin</strong>
      <span class="brand-jawi">
        &#1700;&#1580;&#1575;&#1576;&#1578; &#1575;&#1890;&#1575;&#1605; &#1575;&#1587;&#1604;&#1575;&#1605; &#1583;&#1575;&#1569;&#1610;&#1585;&#1607; &#1585;&#1608;&#1605;&#1700;&#1610;&#1606;
      </span>
    </div>
  </div>
</header>

<div class="container">
  <div class="left">
    <div class="section-title">KAUNTER 1 – 3</div>
    <div id="normal" class="empty">Tiada panggilan</div>
  </div>
  <div class="right">
    <div class="section-title">PEMBAYARAN (KAUNTER 4)</div>
    <div id="payment" class="empty">Tiada panggilan</div>
  </div>
</div>

<footer>&copy; 2026 Pejabat Agama Islam Daerah Rompin</footer>
<audio id="bell" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

<script>
firebase.initializeApp(window.FIREBASE_CONFIG);
const db = firebase.database();

let prevSnapshot = {};
let prevCalled   = {};

// Track which keys are currently being announced (to prevent duplicate)
let processingAnnouncements = new Set();

/* ═══════════════════════════════════════════
   MP3 SYSTEM – langsung cuba main, tanpa fetch
═══════════════════════════════════════════ */
const MP3_BASE = "Voice/";
const EXT = ".mp3";

function mp3Url(filename) {
  return `${MP3_BASE}${filename}${EXT}`;
}

// Audio sequencer
let audioQueue = [];
let isPlaying = false;
let currentSpeakingKey = null;
const audioCache = new Map();

function getAudio(src) {
  if (audioCache.has(src)) return audioCache.get(src);
  const audio = new Audio(src);
  audio.preload = "auto";
  audioCache.set(src, audio);
  return audio;
}

function playSingle(src) {
  return new Promise((resolve, reject) => {
    const audio = getAudio(src);
    audio.currentTime = 0;
    const onEnd = () => {
      audio.removeEventListener("ended", onEnd);
      audio.removeEventListener("error", onError);
      resolve();
    };
    const onError = (e) => {
      audio.removeEventListener("ended", onEnd);
      audio.removeEventListener("error", onError);
      console.error(`❌ Gagal main: ${src}`, e);
      reject(e);
    };
    audio.addEventListener("ended", onEnd);
    audio.addEventListener("error", onError);
    audio.play().catch(reject);
  });
}

async function processQueue() {
  if (isPlaying) return;
  if (audioQueue.length === 0) return;
  isPlaying = true;
  while (audioQueue.length > 0) {
    const item = audioQueue.shift();
    currentSpeakingKey = item.key;
    playBell();
    for (const src of item.sources) {
      try {
        await playSingle(src);
      } catch(e) { /* already logged */ }
    }
    if (item.key) {
      await db.ref("queues/" + item.key + "/called").set(false);
      processingAnnouncements.delete(item.key);
    }
  }
  currentSpeakingKey = null;
  isPlaying = false;
}

function enqueue(key, sources) {
  if (audioQueue.some(item => item.key === key)) return;
  audioQueue.push({ key, sources });
  processQueue();
}

function buildMp3Sequence(number, counter, isPayment) {
  const sources = [];
  const match = String(number).match(/^([A-Za-z]+)(\d+)$/);
  if (!match) return [];

  const letter = match[1].toUpperCase();
  const digits = match[2].split('');

  sources.push(mp3Url(letter));
  for (let d of digits) {
    sources.push(mp3Url(d));
  }
  if (isPayment) {
    sources.push(mp3Url("KAUNTER4"));
  } else {
    sources.push(mp3Url(`KAUNTER${counter}`));
  }
  console.log(`🔊 Urutan MP3 untuk ${number}:`, sources);
  return sources;
}

// Fallback TTS
let cachedVoice = null;
async function getNaturalVoice() {
  if (cachedVoice) return cachedVoice;
  return new Promise((resolve) => {
    const load = () => {
      const voices = speechSynthesis.getVoices();
      let selected = voices.find(v => v.lang === "ms-MY" && (v.name.includes("Siti") || v.name.includes("Google"))) ||
                     voices.find(v => v.lang === "ms-MY") || voices.find(v => v.lang === "ms");
      cachedVoice = selected || voices[0];
      resolve(cachedVoice);
    };
    if (speechSynthesis.getVoices().length) load();
    else speechSynthesis.onvoiceschanged = load;
  });
}

async function fallbackSpeak(number, counter, isPayment, key) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const digitMap = {0:"kosong",1:"satu",2:"dua",3:"tiga",4:"empat",5:"lima",6:"enam",7:"tujuh",8:"lapan",9:"sembilan"};
  const letterMap = {K:"KAY",F:"Ef",M:"Em",D:"Di",L:"El"};
  const match = String(number).match(/^([A-Za-z]+)(\d+)$/);
  let numSpoken = number;
  if (match) {
    const prefix = letterMap[match[1].toUpperCase()] || match[1];
    const digits = match[2].split("").map(d=>digitMap[d]||d).join("... ");
    numSpoken = `${prefix}... ${digits}`;
  }
  const text = isPayment
    ? `Nombor... ${numSpoken}... sila ke... kaunter pembayaran`
    : `Nombor... ${numSpoken}... sila ke... kaunter ${["","satu","dua","tiga","empat"][counter] || counter}`;
  const voice = await getNaturalVoice();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = voice?.lang || "ms-MY";
  utter.voice = voice || null;
  utter.rate = 0.65;
  utter.pitch = 1.1;
  return new Promise((resolve) => {
    utter.onend = () => resolve();
    utter.onerror = () => resolve();
    speechSynthesis.speak(utter);
  });
}

async function announce(number, counter, isPayment, key) {
  if (!number || number === "-") return;
  if (processingAnnouncements.has(key)) return;
  processingAnnouncements.add(key);
  
  const sources = buildMp3Sequence(number, counter, isPayment);
  if (sources.length > 0) {
    enqueue(key, sources);
  } else {
    console.warn(`⚠️ Tiada MP3 untuk ${number}, guna TTS`);
    await fallbackSpeak(number, counter, isPayment, key);
    await db.ref("queues/" + key + "/called").set(false);
    processingAnnouncements.delete(key);
  }
}

function playBell() {
  try { const bell = document.getElementById("bell"); bell.currentTime = 0; bell.play(); } catch(e) {}
}

/* ═══════════════════════════════════════════
   RENDER LOGIC
═══════════════════════════════════════════ */
function getServiceName(code) {
  return { K:"Perkahwinan", F:"Kekeluargaan", M:"Masjid & Surau",
           D:"Dakwah", L:"Lain-lain" }[code] || "-";
}
function displayValue(v, f="-") { return v===undefined||v===null||v===""?f:v; }
function isValidQueue(d) {
  if (!d || !["service","payment"].includes(d.stage)) return false;
  if (!["waiting","serving"].includes(d.status)) return false;
  if (typeof d.number !== "string" || !/^[KFMDL]\d{3}$/.test(d.number)) return false;
  return true;
}
function buildCard(c) {
  const classes = ["card"];
  if (c.isPayment) classes.push("payment-card");
  if (c.flash) classes.push("flash");
  if (c.glow) classes.push("glow");
  const label = c.isPayment ? "KAUNTER 4 — PEMBAYARAN" : `KAUNTER ${c.counter || "-"}`;
  return `<div class="${classes.join(" ")}"><div class="number">${displayValue(c.number)}</div><div class="counter">${label}</div>${!c.isPayment ? `<div class="service-label">${getServiceName(c.service)}</div>` : ""}</div>`;
}

db.ref("queues").on("value", snap => {
  const normalDiv = document.getElementById("normal");
  const paymentDiv = document.getElementById("payment");
  let normalCards=[], paymentCards=[], currentSnap={}, currentCalled={};
  snap.forEach(child=>{
    const d=child.val(), key=child.key;
    if(!isValidQueue(d)||d.status==="done") return;
    currentSnap[key]={stage:d.stage,counter:d.counter,status:d.status};
    currentCalled[key]=!!d.called;
    if(d.status!=="serving") return;
    const isPayment=d.stage==="payment", prev=prevSnapshot[key], isNew=!prev||prev.status!=="serving", justCalled=d.called&&!prevCalled[key];
    const card={key, number:displayValue(d.number), counter:displayValue(d.counter,null), isPayment, glow:!!d.called, flash:isNew, justCalled, service:d.service, timestamp:d.timestamp||0};
    if(isPayment) paymentCards.push(card); else normalCards.push(card);
  });
  normalCards.sort((a,b)=>a.timestamp-b.timestamp);
  paymentCards.sort((a,b)=>a.glow===b.glow?b.timestamp-a.timestamp:a.glow?-1:1);
  normalDiv.innerHTML=""; paymentDiv.innerHTML="";
  const visNorm=normalCards.slice(0,3), visPay=paymentCards.slice(0,1);
  visNorm.forEach(c=>normalDiv.innerHTML+=buildCard(c));
  visPay.forEach(c=>paymentDiv.innerHTML+=buildCard(c));
  if(!normalCards.length) normalDiv.innerHTML=`<div class="empty">Tiada panggilan</div>`;
  if(!paymentCards.length) paymentDiv.innerHTML=`<div class="empty">Tiada panggilan</div>`;

  [...visNorm,...visPay].forEach(c=>{
    if(c.justCalled && !processingAnnouncements.has(c.key)){
      playBell();
      announce(c.number, c.counter, c.isPayment, c.key);
    }
  });

  prevSnapshot=currentSnap; prevCalled=currentCalled;
});

console.log("✅ TV sedia – setiap panggilan hanya diumum SEKALI");
</script>
</body>
</html>
